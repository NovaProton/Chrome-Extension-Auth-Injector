<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Basic Auth</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    width: 380px;
    padding: 14px;
    color: #222;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
  }
  form input {
    padding: 6px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  form input[name="domain"] {
    grid-column: 1 / span 2;
  }
  form button {
    grid-column: 1 / span 2;
    padding: 7px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 1px solid #eee;
    font-size: 12px;
  }
  li .info {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  li .domain {
    font-weight: 600;
  }
  li button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 11px;
    color: #b91c1c;
  }
  .empty {
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
  <h1>Auto Basic Auth — domains</h1>
  <form id="addForm">
    <input name="domain" placeholder="e.g. example.com" required />
    <input name="username" placeholder="username" required />
    <input name="password" placeholder="password" type="password" />
    <button type="submit">Add / update domain</button>
  </form>
  <ul id="list"></ul>
  <p class="empty" id="emptyMsg" style="display:none;">No domains configured yet.</p>
  <script src="options.js"></script>
</body>
</html>
